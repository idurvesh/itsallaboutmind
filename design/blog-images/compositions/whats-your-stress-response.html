<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  html {
    background: radial-gradient(circle at 78% 25%, #3a2a66 0%, #1a1030 45%, #0f0a1f 100%);
    font-family: 'Inter', sans-serif;
    position: relative;
  }

  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(185,163,255,0.18) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    opacity: 0.5;
  }

  .pulse {
    position: absolute;
    right: 60px;
    top: 130px;
    width: 420px;
    height: 200px;
  }

  .pulse svg { width: 100%; height: 100%; }

  .gauge-ring {
    position: absolute;
    right: 150px;
    bottom: 60px;
    width: 220px;
    height: 220px;
  }

  .content {
    position: absolute;
    left: 80px;
    top: 100px;
    width: 620px;
  }

  .eyebrow {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #b9a3ff;
    margin-bottom: 22px;
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 68px;
    line-height: 1.1;
    color: #f6f3ff;
    margin-bottom: 28px;
  }

  .title em {
    font-style: italic;
    color: #b9a3ff;
  }

  .sub {
    font-size: 26px;
    font-weight: 500;
    color: #cabfec;
  }

  .footer {
    position: absolute;
    left: 80px;
    bottom: 56px;
    font-size: 22px;
    font-weight: 600;
    color: #8a78c2;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="dots"></div>

  <div class="content">
    <div class="eyebrow">Free Quiz</div>
    <div class="title">What's your<br/><em>stress</em> response?</div>
    <div class="sub">6 questions &middot; 2 minutes &middot; instant score</div>
  </div>

  <div class="pulse">
    <svg viewBox="0 0 420 200" fill="none">
      <polyline points="0,110 60,110 90,60 120,150 150,20 180,170 210,110 260,110 290,90 320,130 350,110 420,110"
        stroke="#b9a3ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="150" cy="20" r="6" fill="#7c5cff"/>
    </svg>
  </div>

  <div class="gauge-ring">
    <svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(185,163,255,0.18)" stroke-width="14"/>
      <circle cx="100" cy="100" r="80" fill="none" stroke="#7c5cff" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="502" stroke-dashoffset="180"
        transform="rotate(-90 100 100)"/>
    </svg>
  </div>

  <div class="footer">It's All About Mind</div>
</body>
</html>
