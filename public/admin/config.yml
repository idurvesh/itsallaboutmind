backend:
  name: github
  repo: idurvesh/itsallaboutmind
  branch: main
  base_url: https://itsallaboutmind.com
  auth_endpoint: /api/auth

media_folder: "public/images"
public_folder: "/images"


collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The main headline of your post" }
      - { label: "Description", name: "description", widget: "text", hint: "A short summary shown on the blog listing page" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Mindset"
          - "Meditation"
          - "Law of Attraction"
          - "Philosophy"
          - "Stoicism"
          - "Manifestation"
        default: "Mindset"
      - { label: "Read Time", name: "readTime", widget: "string", default: "5 min read" }
      - { label: "Author", name: "author", widget: "string", default: "It's All About Mind" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false, hint: "Hero image shown at the top of the post" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false, hint: "50–60 chars. Leave blank to use post title." }
      - { label: "Meta Description", name: "seoDescription", widget: "text", required: false, hint: "150–160 chars. Leave blank to use post description." }
      - { label: "Focus Keyword", name: "focusKeyword", widget: "string", required: false, hint: "The main keyword this post should rank for." }
      - { label: "OG / Social Image", name: "ogImage", widget: "image", required: false, hint: "Shown when shared on social media (1200x630px)." }
      - { label: "Canonical URL", name: "canonicalUrl", widget: "string", required: false, hint: "Only set if republished from another URL." }
